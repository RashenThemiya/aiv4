name: Build and deploy Docker images

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: ./frontend
            image: mhartvishwajith448/rag-frontendv4
          - name: backend
            context: ./backend
            image: mhartvishwajith448/rag-backendv4
          - name: rag-service
            context: ./rag-service
            image: mhartvishwajith448/rag-servicev4

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=/backend
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Pull images and restart server
    needs: build-and-push
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH and environment files
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          RAG_ENV: ${{ secrets.RAG_ENV }}
          SERVER_ENV: ${{ secrets.SERVER_ENV }}
        run: |
          set -euo pipefail
          for value in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS BACKEND_ENV RAG_ENV; do
            if [ -z "${!value}" ]; then echo "Missing secret: $value"; exit 1; fi
          done
          umask 077
          mkdir -p ~/.ssh deploy-env
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$BACKEND_ENV" > deploy-env/.env.backend
          printf '%s\n' "$RAG_ENV" > deploy-env/.env.rag
          printf '%s\n' "$SERVER_ENV" > deploy-env/.env

      - name: Deploy release
        shell: bash
        env:
          SSH_HOST: ${{ vars.SSH_HOST || '161.97.165.83' }}
          SSH_USER: ${{ vars.SSH_USER || 'root' }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          target="$SSH_USER@$SSH_HOST"
          ssh_options=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -p "$SSH_PORT")
          ssh "${ssh_options[@]}" "$target" 'umask 077; mkdir -p /opt/whatsapp-chatbot; chmod 700 /opt/whatsapp-chatbot; command -v docker; docker compose version'
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -P "$SSH_PORT" docker-compose.yml scripts/deploy.sh deploy-env/.env deploy-env/.env.backend deploy-env/.env.rag "$target:/opt/whatsapp-chatbot/"
          # The Docker Hub username is passed as data, never interpolated into remote shell code.
          printf '%s\n' "$DOCKERHUB_USERNAME" | ssh "${ssh_options[@]}" "$target" 'umask 077; cat > /opt/whatsapp-chatbot/.registry-user'
          printf '%s' "$DOCKERHUB_TOKEN" | ssh "${ssh_options[@]}" "$target" 'docker login --username "$(cat /opt/whatsapp-chatbot/.registry-user)" --password-stdin'
          ssh "${ssh_options[@]}" "$target" "cd /opt/whatsapp-chatbot && bash deploy.sh '$IMAGE_TAG'"

      - name: Remove runner credentials
        if: always()
        run: rm -rf deploy-env ~/.ssh/id_ed25519
