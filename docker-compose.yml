name: whatsapp-chatbot

services:
  frontend:
    image: mhartvishwajith448/rag-frontendv4:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    image: mhartvishwajith448/rag-backendv4:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.backend
    environment:
      PORT: "3000"
      NODE_ENV: production
      RAG_SERVICE_URL: http://rag-service:8000
      UPLOAD_DIR: /app/uploads
    ports:
      - "${BACKEND_BIND_IP:-127.0.0.1}:${BACKEND_PORT:-3000}:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      rag-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>r.json()).then(h=>{if(h.mongodb!=='connected'||h.ragService!=='ok')process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  rag-service:
    image: mhartvishwajith448/rag-servicev4:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.rag
    environment:
      CHROMA_PERSIST_DIR: /app/chroma_data
    volumes:
      - chroma:/app/chroma_data
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

volumes:
  uploads:
  chroma:
